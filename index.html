<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japs (잽스) - 글로벌 게임 & 커뮤니티</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        
        /* Glassmorphism & Custom Glow */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease-in-out;
        }
        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.15);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
        }
        .neon-text-glow {
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="bg-[#070a11] text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- Background Ambient Light -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[300px] bg-cyan-600/15 blur-[140px] pointer-events-none rounded-full -z-10"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[300px] bg-purple-600/15 blur-[140px] pointer-events-none rounded-full -z-10"></div>

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <!-- Logo -->
            <div onclick="filterCategory('all')" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-sky-500 to-indigo-600 p-[2px] shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-transform">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center font-black text-cyan-400 text-xl">
                        J
                    </div>
                </div>
                <div>
                    <span class="font-black text-2xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-200 to-cyan-400 neon-text-glow">
                        JAPS <span class="text-xs text-cyan-400 font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30">잽스</span>
                    </span>
                </div>
            </div>

            <!-- User Auth Bar -->
            <div id="auth-status-container" class="flex items-center gap-3">
                <!-- Dynamic Content via JS -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow w-full">
        
        <!-- Banner -->
        <section class="mb-8 p-8 rounded-3xl glass-panel relative overflow-hidden border border-cyan-500/20">
            <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 max-w-2xl">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold mb-3">
                    <i data-lucide="gamepad-2" class="w-3.5 h-3.5"></i> 게임 공략 & 질문 지식인 커뮤니티
                </span>
                <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3 leading-tight">
                    막히는 게임 구간? <span class="text-cyan-400">JAPS</span>에서 공략 찾고 바로 해결하세요!
                </h1>
                <p class="text-slate-400 text-sm md:text-base">
                    게스트는 공략 및 답변을 자유롭게 읽을 수 있으며, <strong class="text-cyan-300">구글 / 애플 로그인</strong> 시 직접 질문글 작성과 집단지성 답변 참여가 가능합니다.
                </p>
            </div>
        </section>

        <!-- Main Action & Filters -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
            <!-- Category Tabs -->
            <div class="flex items-center gap-2 p-1.5 rounded-2xl bg-slate-900/80 border border-slate-800 w-full md:w-auto overflow-x-auto">
                <button onclick="filterCategory('all')" id="tab-all" class="cat-btn active px-4 py-2 rounded-xl text-xs font-bold transition-all bg-cyan-500 text-black shadow-md">
                    🔥 전체보기
                </button>
                <button onclick="filterCategory('guide')" id="tab-guide" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white">
                    🎯 게임 공략
                </button>
                <button onclick="filterCategory('qna')" id="tab-qna" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white">
                    ❓ 질문 & 도와주세요
                </button>
                <button onclick="filterCategory('free')" id="tab-free" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white">
                    💬 자유 게시판
                </button>
            </div>

            <!-- Write Button -->
            <button onclick="openWriteModal()" class="w-full md:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-cyan-500/25 active:scale-95">
                <i data-lucide="pen-tool" class="w-4 h-4"></i>
                <span>글쓰기 / 질문하기</span>
            </button>
        </div>

        <!-- Post List Feed -->
        <div id="posts-container" class="space-y-4">
            <!-- Dynamic Post Cards loaded via JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950/60 py-8 mt-12 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 text-center text-xs text-slate-500">
            <p class="mb-2 font-semibold text-slate-400">JAPS Community Platform &copy; 2026. All rights reserved.</p>
            <p>본 사이트는 게임 공략, 질문 답변 및 자유로운 소통을 위해 제작되었습니다.</p>
        </div>
    </footer>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center mx-auto mb-3 font-black text-2xl">
                    J
                </div>
                <h3 class="text-xl font-bold text-white">JAPS 로그인</h3>
                <p class="text-xs text-slate-400 mt-1">글 작성 및 답글 참여를 위해 로그인하세요.</p>
            </div>

            <div class="space-y-3">
                <!-- Google Login Button -->
                <button onclick="socialLogin('Google')" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium text-xs flex items-center justify-center gap-3 transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
                    Google 계정으로 계속하기
                </button>
                <!-- Apple Login Button -->
                <button onclick="socialLogin('Apple')" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium text-xs flex items-center justify-center gap-3 transition-all">
                    <i data-lucide="apple" class="w-4 h-4 text-white"></i>
                    Apple 계정으로 계속하기
                </button>
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
                    <div class="relative flex justify-center text-[10px] uppercase"><span class="bg-slate-900 px-2 text-slate-500">또는</span></div>
                </div>
                <!-- Guest Button -->
                <button onclick="guestMode()" class="w-full py-2.5 px-4 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-400 font-medium text-xs flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                    게스트로 둘러보기 (글 작성 불가)
                </button>
            </div>
        </div>
    </div>

    <!-- Write Post Modal -->
    <div id="write-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-xl w-full mx-4 shadow-2xl relative">
            <button onclick="closeWriteModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-5 h-5 text-cyan-400"></i> 새 글 / 게임 질문 작성하기
            </h3>

            <form onsubmit="submitPost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">카테고리 선택</label>
                    <select id="post-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
                        <option value="guide">🎯 게임 공략</option>
                        <option value="qna">❓ 질문 & 도와주세요</option>
                        <option value="free">💬 자유 게시판</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">제목</label>
                    <input type="text" id="post-title" required placeholder="예: [엘든링] 초반 사기 무기 위치공략 부탁드립니다!" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">내용 및 설명</label>
                    <textarea id="post-content" required rows="5" placeholder="궁금한 부분이나 공유하고 싶은 게임 공략 내용을 상세히 적어주세요..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeWriteModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">취소</button>
                    <button type="submit" class="px-6 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-extrabold shadow-md shadow-cyan-500/20">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Post Detail / Comment Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-2xl w-full mx-4 shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="detail-content" class="overflow-y-auto pr-2 space-y-6">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // State Management
        let currentUser = JSON.parse(localStorage.getItem('japs_user')) || { type: 'guest', name: '게스트' };
        let currentFilter = 'all';

        // Initial Seed Posts (Dummy data for initial loading)
        const defaultPosts = [
            {
                id: 1,
                category: 'guide',
                categoryName: '🎯 게임 공략',
                title: '몬스터 헌터 초보자를 위한 초반 무기 추천 및 팁 세트',
                content: '초보자분들은 한손검이나 대검으로 시작하는 것을 추천합니다. 타격감이 좋고 패턴 익히기 가장 적합합니다!',
                author: 'Google_Gamer',
                provider: 'Google',
                date: '2026-08-17',
                likes: 12,
                comments: [
                    { author: 'Apple_User', provider: 'Apple', content: '한손검 방어가 진짜 꿀이더라구요 꿀팁 감사합니다!' }
                ]
            },
            {
                id: 2,
                category: 'qna',
                categoryName: '❓ 질문 & 도와주세요',
                title: 'GTA6 모드 설치 중에 튕기는데 해결 방법 아시는 분 계신가요?',
                content: '그래픽 모드 적용 후 계속 렌더링 에러가 떠서 차가 안 움직이네요 ㅠㅠ 도움 부탁드립니다.',
                author: 'Apple_Gamer',
                provider: 'Apple',
                date: '2026-08-17',
                likes: 5,
                comments: [
                    { author: 'Google_Pro', provider: 'Google', content: '모드 파일 폴더 권한 문제일 수 있습니다. CNAME 및 d3d11.dll 파일 재설치해 보세요.' }
                ]
            }
        ];

        let posts = JSON.parse(localStorage.getItem('japs_posts')) || defaultPosts;

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderAuthUI();
            renderPosts();
        });

        // Render Auth Bar
        function renderAuthUI() {
            const container = document.getElementById('auth-status-container');
            if (currentUser.type === 'guest') {
                container.innerHTML = `
                    <span class="text-xs text-slate-400 hidden sm:inline">현재: <strong class="text-slate-200">게스트 (읽기 전용)</strong></span>
                    <button onclick="openLoginModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs border border-slate-700 transition-all flex items-center gap-1.5">
                        <i data-lucide="log-in" class="w-3.5 h-3.5"></i> 로그인 / 회원가입
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-xs font-bold text-white">${currentUser.name}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">${currentUser.provider}</span>
                    </div>
                    <button onclick="logout()" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-rose-400 border border-slate-800 transition-all" title="로그아웃">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                `;
            }
            lucide.createIcons();
        }

        // Login Handler
        function socialLogin(provider) {
            const randomName = provider + '_' + Math.floor(1000 + Math.random() * 9000);
            currentUser = { type: 'user', name: randomName, provider: provider };
            localStorage.setItem('japs_user', JSON.stringify(currentUser));
            closeLoginModal();
            renderAuthUI();
            alert(`${provider} 계정으로 성공적으로 로그인되었습니다! 이제 게시물과 댓글을 작성할 수 있습니다.`);
        }

        function guestMode() {
            currentUser = { type: 'guest', name: '게스트' };
            localStorage.setItem('japs_user', JSON.stringify(currentUser));
            closeLoginModal();
            renderAuthUI();
        }

        function logout() {
            currentUser = { type: 'guest', name: '게스트' };
            localStorage.setItem('japs_user', JSON.stringify(currentUser));
            renderAuthUI();
        }

        // Filter Posts
        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white";
            });
            const activeBtn = document.getElementById(`tab-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn active px-4 py-2 rounded-xl text-xs font-bold transition-all bg-cyan-500 text-black shadow-md shadow-cyan-500/20";
            }
            renderPosts();
        }

        // Render Post List
        function renderPosts() {
            const container = document.getElementById('posts-container');
            const filtered = currentFilter === 'all' ? posts : posts.filter(p => p.category === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-card rounded-2xl">
                        <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
                        <p class="text-slate-400 text-sm">등록된 게시물이 없습니다. 첫 공략/질문을 작성해 보세요!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(post => `
                <div onclick="openDetailModal(${post.id})" class="glass-card p-5 rounded-2xl cursor-pointer flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-2 flex-grow">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">${post.categoryName}</span>
                            <span class="text-xs text-slate-500">${post.date}</span>
                        </div>
                        <h3 class="text-base font-bold text-white group-hover:text-cyan-400 transition-colors">${post.title}</h3>
                        <p class="text-xs text-slate-400 line-clamp-1">${post.content}</p>
                    </div>
                    <div class="flex items-center justify-between md:justify-end gap-4 border-t md:border-t-0 pt-3 md:pt-0 border-slate-800 text-xs text-slate-400">
                        <span class="flex items-center gap-1 font-medium text-slate-300">
                            <i data-lucide="user" class="w-3.5 h-3.5 text-cyan-400"></i> ${post.author}
                        </span>
                        <div class="flex items-center gap-3">
                            <span class="flex items-center gap-1"><i data-lucide="thumbs-up" class="w-3.5 h-3.5 text-slate-500"></i> ${post.likes}</span>
                            <span class="flex items-center gap-1"><i data-lucide="message-square" class="w-3.5 h-3.5 text-cyan-400"></i> ${post.comments.length}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Open/Close Modals
        function openLoginModal() {
            const m = document.getElementById('login-modal');
            m.classList.remove('hidden');
            setTimeout(() => m.classList.add('opacity-100'), 10);
        }
        function closeLoginModal() {
            const m = document.getElementById('login-modal');
            m.classList.remove('opacity-100');
            setTimeout(() => m.classList.add('hidden'), 200);
        }

        function openWriteModal() {
            if (currentUser.type === 'guest') {
                alert('게스트 상태에서는 글을 작성할 수 없습니다. 구글 또는 애플 계정으로 로그인해주세요!');
                openLoginModal();
                return;
            }
            const m = document.getElementById('write-modal');
            m.classList.remove('hidden');
            setTimeout(() => m.classList.add('opacity-100'), 10);
        }
        function closeWriteModal() {
            const m = document.getElementById('write-modal');
            m.classList.remove('opacity-100');
            setTimeout(() => m.classList.add('hidden'), 200);
        }

        // Submit Post
        function submitPost(e) {
            e.preventDefault();
            const cat = document.getElementById('post-category').value;
            const catNames = { guide: '🎯 게임 공략', qna: '❓ 질문 & 도와주세요', free: '💬 자유 게시판' };
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            const newPost = {
                id: Date.now(),
                category: cat,
                categoryName: catNames[cat],
                title: title,
                content: content,
                author: currentUser.name,
                provider: currentUser.provider,
                date: new Date().toISOString().split('T')[0],
                likes: 0,
                comments: []
            };

            posts.unshift(newPost);
            localStorage.setItem('japs_posts', JSON.stringify(posts));
            closeWriteModal();
            renderPosts();
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
        }

        // Detail & Comment View
        function openDetailModal(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            const container = document.getElementById('detail-content');
            container.innerHTML = `
                <div class="border-b border-slate-800 pb-4 space-y-2">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">${post.categoryName}</span>
                    <h2 class="text-xl font-black text-white">${post.title}</h2>
                    <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                        <span>작성자: <strong class="text-slate-200">${post.author}</strong> (${post.provider})</span>
                        <span>${post.date}</span>
                    </div>
                </div>
                
                <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap py-2">
                    ${post.content}
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button onclick="likePost(${post.id})" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-cyan-400 flex items-center gap-1.5 border border-slate-700">
                        <i data-lucide="thumbs-up" class="w-4 h-4"></i> 추천 (${post.likes})
                    </button>
                </div>

                <!-- Comment Section -->
                <div class="border-t border-slate-800 pt-6 space-y-4">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-cyan-400"></i> 답변 및 댓글 (${post.comments.length})
                    </h3>

                    <!-- Comment Input -->
                    <div class="flex gap-2">
                        <input type="text" id="comment-input" placeholder="${currentUser.type === 'guest' ? '로그인 후 답글 작성이 가능합니다' : '답글 또는 공략 팁을 입력하세요...'}" ${currentUser.type === 'guest' ? 'disabled' : ''} class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                        <button onclick="addComment(${post.id})" ${currentUser.type === 'guest' ? 'disabled' : ''} class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-black text-xs font-bold">등록</button>
                    </div>

                    <!-- Comment List -->
                    <div class="space-y-3 pt-2">
                        ${post.comments.length === 0 ? '<p class="text-xs text-slate-500">아직 답변이 없습니다. 첫 번째로 도와주세요!</p>' : ''}
                        ${post.comments.map(c => `
                            <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs space-y-1">
                                <div class="flex items-center justify-between text-slate-400">
                                    <span class="font-bold text-cyan-400">${c.author}</span>
                                </div>
                                <p class="text-slate-300">${c.content}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            const m = document.getElementById('detail-modal');
            m.classList.remove('hidden');
            setTimeout(() => m.classList.add('opacity-100'), 10);
            lucide.createIcons();
        }

        function closeDetailModal() {
            const m = document.getElementById('detail-modal');
            m.classList.remove('opacity-100');
            setTimeout(() => m.classList.add('hidden'), 200);
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes++;
                localStorage.setItem('japs_posts', JSON.stringify(posts));
                openDetailModal(id);
                renderPosts();
            }
        }

        function addComment(id) {
            if (currentUser.type === 'guest') return;
            const input = document.getElementById('comment-input');
            if (!input.value.trim()) return;

            const post = posts.find(p => p.id === id);
            if (post) {
                post.comments.push({
                    author: currentUser.name,
                    provider: currentUser.provider,
                    content: input.value
                });
                localStorage.setItem('japs_posts', JSON.stringify(posts));
                openDetailModal(id);
                renderPosts();
            }
        }
    </script>
</body>
</html>
