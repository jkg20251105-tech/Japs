<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japs (잽스)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK (실제 인증 및 데이터베이스) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #080a0f; color: #f1f5f9; }
        
        /* Ultra Smooth Glassmorphism */
        .glass-header {
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(22, 30, 48, 0.7);
            transform: translateY(-2px);
        }
        .glass-input {
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        .glass-input:focus {
            border-color: #06b6d4;
            outline: none;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-header">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div onclick="location.reload()" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center font-black text-cyan-400 text-lg group-hover:scale-105 transition-transform">
                    J
                </div>
                <span class="font-extrabold text-xl tracking-wider text-white">JAPS</span>
            </div>

            <!-- User Status & Auth -->
            <div id="user-auth-bar" class="flex items-center gap-3">
                <span class="text-xs text-slate-500">연동 중...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-6 py-8 flex-grow w-full">
        
        <!-- Header Controls -->
        <div class="flex items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-black text-white">커뮤니티 광장</h1>
                <p class="text-xs text-slate-400 mt-1">자유롭게 글을 쓰고 실시간 답글을 주고받아 보세요.</p>
            </div>
            
            <button onclick="openWriteModal()" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold text-xs flex items-center gap-2 transition-all shadow-lg shadow-cyan-500/20 active:scale-95">
                <i data-lucide="square-pen" class="w-4 h-4"></i>
                <span>글쓰기</span>
            </button>
        </div>

        <!-- Post List Feed -->
        <div id="posts-list" class="space-y-3">
            <div class="text-center py-12 text-slate-500 text-xs">게시글을 불러오는 중입니다...</div>
        </div>

    </main>

    <!-- Write Post Modal (Title & Description Only) -->
    <div id="write-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-[#0f1420] border border-slate-800 rounded-2xl p-6 max-w-lg w-full mx-4 shadow-2xl relative">
            <button onclick="closeWriteModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-4">새 글 작성</h3>

            <form onsubmit="handleCreatePost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">제목</label>
                    <input type="text" id="post-title" required placeholder="제목을 입력하세요" class="w-full rounded-xl px-4 py-2.5 text-xs glass-input">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">설명 / 내용</label>
                    <textarea id="post-content" required rows="6" placeholder="내용을 상세히 입력하세요..." class="w-full rounded-xl px-4 py-2.5 text-xs glass-input resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeWriteModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-extrabold">작성완료</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Auth Modal (Real Email Verification & Social) -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-[#0f1420] border border-slate-800 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="text-center mb-5">
                <h3 class="text-lg font-bold text-white">로그인 / 회원가입</h3>
                <p class="text-xs text-slate-400 mt-1">진짜 인증 및 글로벌 소통을 위한 로그인</p>
            </div>

            <!-- Social Login -->
            <button onclick="handleGoogleLogin()" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium text-xs flex items-center justify-center gap-2 mb-3 transition-all">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
                Google 계정으로 로그인
            </button>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase"><span class="bg-[#0f1420] px-2 text-slate-500">이메일 로그인 및 인증</span></div>
            </div>

            <!-- Real Email Auth Form -->
            <form onsubmit="handleEmailAuth(event)" class="space-y-3">
                <input type="email" id="auth-email" required placeholder="이메일 주소" class="w-full rounded-xl px-4 py-2 text-xs glass-input">
                <input type="password" id="auth-password" required placeholder="비밀번호 (6자리 이상)" class="w-full rounded-xl px-4 py-2 text-xs glass-input">
                <div class="flex gap-2 pt-1">
                    <button type="submit" onclick="authMode = 'login'" class="w-1/2 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold">로그인</button>
                    <button type="submit" onclick="authMode = 'signup'" class="w-1/2 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-bold">실제 이메일 가입</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Post Detail & Replies Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="bg-[#0f1420] border border-slate-800 rounded-2xl p-6 max-w-xl w-full mx-4 shadow-2xl relative max-h-[85vh] flex flex-col">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="detail-body" class="overflow-y-auto pr-1 space-y-5">
                <!-- Loaded Dynamically -->
            </div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. Firebase 설정 (내 Firebase 콘솔 값으로 교체하세요)
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let authMode = 'login';
        let currentPostId = null;

        // ----------------------------------------------------
        // 2. 인증 상태 변화 감지 (실제 상태 유지)
        // ----------------------------------------------------
        auth.onAuthStateChanged(user => {
            currentUser = user;
            const bar = document.getElementById('user-auth-bar');
            
            if (user) {
                const isVerified = user.emailVerified ? '<span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">인증됨</span>' : '<span class="text-[10px] text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20">미인증</span>';
                
                bar.innerHTML = `
                    <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                        <span class="font-bold text-white">${user.displayName || user.email.split('@')[0]}</span>
                        ${isVerified}
                    </div>
                    <button onclick="auth.signOut()" class="p-2 rounded-xl bg-slate-900 text-slate-400 hover:text-rose-400 border border-slate-800" title="로그아웃">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                `;
            } else {
                bar.innerHTML = `
                    <button onclick="openAuthModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs border border-slate-700">
                        로그인 / 회원가입
                    </button>
                `;
            }
            lucide.createIcons();
        });

        // ----------------------------------------------------
        // 3. 실제 이메일 가입 / 로그인 / 인증 이메일 발송
        // ----------------------------------------------------
        function handleEmailAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (authMode === 'signup') {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(res => {
                        res.user.sendEmailVerification();
                        alert("회원가입 성공! 입력하신 이메일로 인증 메일을 발송했습니다. 메일함을 확인해 주세요.");
                        closeAuthModal();
                    })
                    .catch(err => alert("가입 실패: " + err.message));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => closeAuthModal())
                    .catch(err => alert("로그인 실패: " + err.message));
            }
        }

        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => closeAuthModal())
                .catch(err => alert("구글 로그인 실패: " + err.message));
        }

        // ----------------------------------------------------
        // 4. 실시간 글쓰기 & 불러오기 (Firebase Firestore)
        // ----------------------------------------------------
        function handleCreatePost(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("글을 작성하려면 로그인이 필요합니다.");
                openAuthModal();
                return;
            }

            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            db.collection('posts').add({
                title: title,
                content: content,
                author: currentUser.displayName || currentUser.email.split('@')[0],
                authorId: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                likes: 0
            }).then(() => {
                closeWriteModal();
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
            }).catch(err => alert("글 저장 실패: " + err.message));
        }

        // 실시간 커뮤니티 데이터 동기화 (Snapshot)
        db.collection('posts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const container = document.getElementById('posts-list');
            if (snapshot.empty) {
                container.innerHTML = `<div class="text-center py-12 glass-card rounded-2xl text-slate-500 text-xs">작성된 글이 없습니다. 첫 번째 글을 작성해 보세요!</div>`;
                return;
            }

            container.innerHTML = snapshot.docs.map(doc => {
                const p = doc.data();
                const dateStr = p.createdAt ? new Date(p.createdAt.toDate()).toLocaleDateString() : '방금 전';
                return `
                    <div onclick="openDetailModal('${doc.id}')" class="glass-card p-5 rounded-2xl cursor-pointer flex flex-col gap-2">
                        <div class="flex items-center justify-between text-xs text-slate-500">
                            <span class="font-bold text-cyan-400">${p.author}</span>
                            <span>${dateStr}</span>
                        </div>
                        <h3 class="text-base font-bold text-white">${p.title}</h3>
                        <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${p.content}</p>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        });

        // ----------------------------------------------------
        // 5. 답글(댓글) 기능 (실시간 연동)
        // ----------------------------------------------------
        function openDetailModal(postId) {
            currentPostId = postId;
            db.collection('posts').doc(postId).get().then(doc => {
                if (!doc.exists) return;
                const p = doc.data();

                const container = document.getElementById('detail-body');
                container.innerHTML = `
                    <div class="border-b border-slate-800 pb-4 space-y-2">
                        <h2 class="text-xl font-black text-white">${p.title}</h2>
                        <span class="text-xs text-cyan-400 font-semibold">${p.author}</span>
                    </div>
                    <div class="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap py-2">
                        ${p.content}
                    </div>

                    <!-- Answer / Comments Section -->
                    <div class="border-t border-slate-800 pt-5 space-y-4">
                        <h4 class="text-xs font-bold text-white flex items-center gap-1.5">
                            <i data-lucide="message-square" class="w-4 h-4 text-cyan-400"></i> 답글 목록
                        </h4>

                        <!-- Comment Write -->
                        <div class="flex gap-2">
                            <input type="text" id="reply-input" placeholder="${currentUser ? '답글을 입력하세요...' : '로그인 후 답글 작성이 가능합니다'}" ${currentUser ? '' : 'disabled'} class="flex-grow rounded-xl px-4 py-2 text-xs glass-input">
                            <button onclick="handleAddReply('${doc.id}')" ${currentUser ? '' : 'disabled'} class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-black text-xs font-bold">등록</button>
                        </div>

                        <!-- Replies List container -->
                        <div id="replies-list" class="space-y-2 pt-2">
                            <div class="text-xs text-slate-500">답글을 로딩 중...</div>
                        </div>
                    </div>
                `;

                const m = document.getElementById('detail-modal');
                m.classList.remove('hidden');
                setTimeout(() => m.classList.add('opacity-100'), 10);
                lucide.createIcons();

                // 실시간 댓글 구독
                listenReplies(postId);
            });
        }

        function listenReplies(postId) {
            db.collection('posts').doc(postId).collection('replies').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
                const list = document.getElementById('replies-list');
                if (!list) return;
                
                if (snapshot.empty) {
                    list.innerHTML = `<p class="text-xs text-slate-500">작성된 답글이 없습니다.</p>`;
                    return;
                }

                list.innerHTML = snapshot.docs.map(doc => {
                    const r = doc.data();
                    return `
                        <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs space-y-1">
                            <span class="font-bold text-cyan-400">${r.author}</span>
                            <p class="text-slate-300">${r.content}</p>
                        </div>
                    `;
                }).join('');
            });
        }

        function handleAddReply(postId) {
            const input = document.getElementById('reply-input');
            if (!input || !input.value.trim()) return;

            db.collection('posts').doc(postId).collection('replies').add({
                author: currentUser.displayName || currentUser.email.split('@')[0],
                authorId: currentUser.uid,
                content: input.value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = '';
            });
        }

        // Modal Controllers
        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('auth-modal').classList.add('opacity-100'), 10); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.remove('opacity-100'); setTimeout(() => document.getElementById('auth-modal').classList.add('hidden'), 200); }
        function openWriteModal() { if(!currentUser){ alert("로그인이 필요합니다."); openAuthModal(); return; } document.getElementById('write-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('write-modal').classList.add('opacity-100'), 10); }
        function closeWriteModal() { document.getElementById('write-modal').classList.remove('opacity-100'); setTimeout(() => document.getElementById('write-modal').classList.add('hidden'), 200); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('opacity-100'); setTimeout(() => document.getElementById('detail-modal').classList.add('hidden'), 200); }

        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</body>
</html>
