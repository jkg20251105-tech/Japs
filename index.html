<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japs - 커뮤니티</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- 헤더 / 네비게이션 -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-500 tracking-wide flex items-center gap-2">
        <i class="fa-solid font-bold text-blue-400">⚡</i> Japs
      </h1>
      
      <!-- 로그인 안 됨 상태 -->
      <div id="auth-logged-out" class="flex gap-2">
        <button onclick="openModal('login-modal')" class="px-3 py-1.5 text-sm bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition">로그인</button>
        <button onclick="openModal('signup-modal')" class="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition">회원가입</button>
      </div>

      <!-- 로그인 됨 상태 -->
      <div id="auth-logged-in" class="hidden flex items-center gap-3">
        <span id="user-display-name" class="text-sm font-medium text-gray-300"></span>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-sm bg-red-600 hover:bg-red-500 text-white rounded-lg transition">로그아웃</button>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐트 -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- 글 작성 구역 -->
    <section class="bg-gray-800 rounded-xl p-4 border border-gray-700 shadow-md mb-6">
      <h2 class="text-lg font-semibold mb-3 text-gray-200">새 글 작성하기</h2>
      <form id="post-form" onsubmit="handleCreatePost(event)" class="space-y-3">
        <input type="text" id="post-title" placeholder="제목을 입력하세요..." required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-sm">
        <textarea id="post-content" rows="3" placeholder="어떤 이야기를 공유하고 싶으신가요?" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
        <div class="flex justify-end">
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-lg transition flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 게시하기
          </button>
        </div>
      </form>
    </section>

    <!-- 게시글 목록 -->
    <section>
      <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
        <i class="fa-solid fa-fire text-orange-500"></i> 최신 커뮤니티 글
      </h2>
      <div id="posts-container" class="space-y-4">
        <!-- 게시글이 여기에 동적으로 들어옵니다 -->
        <p class="text-gray-500 text-center py-8">게시글을 불러오는 중입니다...</p>
      </div>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
    &copy; 2026 Japs Community. All rights reserved.
  </footer>

  <!-- 로그인 모달 -->
  <div id="login-modal" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-sm w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('login-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white">&times;</button>
      <h3 class="text-xl font-bold mb-4 text-center">로그인</h3>
      <form onsubmit="handleEmailLogin(event)" class="space-y-3">
        <input type="email" id="login-email" placeholder="이메일" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
        <input type="password" id="login-password" placeholder="비밀번호" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
        <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition">로그인</button>
      </form>
      <div class="my-4 flex items-center gap-2 text-gray-500 text-xs">
        <hr class="flex-grow border-gray-700"> 또는 <hr class="flex-grow border-gray-700">
      </div>
      <button onclick="handleGoogleLogin()" class="w-full py-2 bg-white hover:bg-gray-100 text-gray-900 font-medium rounded-lg text-sm transition flex justify-center items-center gap-2">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4" alt="Google">
        Google 계정으로 로그인
      </button>
    </div>
  </div>

  <!-- 회원가입 모달 -->
  <div id="signup-modal" class="fixed inset-0 bg-black/60 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-sm w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('signup-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white">&times;</button>
      <h3 class="text-xl font-bold mb-4 text-center">회원가입</h3>
      <form onsubmit="handleEmailSignUp(event)" class="space-y-3">
        <input type="email" id="signup-email" placeholder="이메일 주소" required
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
        <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required minlength="6"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
        <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition">가입하기</button>
      </form>
    </div>
  </div>

  <!-- 파이어베이스 로직 -->
  <script>
    // 1. 파이어베이스 실제 설정 적용
    const firebaseConfig = {
      apiKey: "AIzaSyDq4ozvVzx7UbuxZwQYYtgQ85UKTh1RQ2E",
      authDomain: "japs-7e3f7.firebaseapp.com",
      projectId: "japs-7e3f7",
      storageBucket: "japs-7e3f7.firebasestorage.app",
      messagingSenderId: "927115722146",
      appId: "1:927115722146:web:a61e999b767471adf386fb",
      measurementId: "G-M7WM2QFPBD"
    };

    // 2. 파이어베이스 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // 3. 인증 상태 상태 감지
    auth.onAuthStateChanged((user) => {
      currentUser = user;
      const loggedOutBox = document.getElementById('auth-logged-out');
      const loggedInBox = document.getElementById('auth-logged-in');
      const nameSpan = document.getElementById('user-display-name');

      if (user) {
        loggedOutBox.classList.add('hidden');
        loggedInBox.classList.remove('hidden');
        nameSpan.innerText = user.displayName || user.email.split('@')[0] + ' 님';
      } else {
        loggedOutBox.classList.remove('hidden');
        loggedInBox.classList.add('hidden');
        nameSpan.innerText = '';
      }
    });

    // 4. 구글 로그인
    function handleGoogleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => {
          closeModal('login-modal');
        })
        .catch((error) => {
          alert("구글 로그인 오류: " + error.message);
        });
    }

    // 5. 이메일 회원가입 (인증 링크 발송)
    function handleEmailSignUp(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((result) => {
          return result.user.sendEmailVerification();
        })
        .then(() => {
          alert("회원가입이 완료되었습니다!\n입력하신 이메일로 인증 링크가 발송되었으니 확인 후 링크를 눌러주세요.");
          closeModal('signup-modal');
        })
        .catch((error) => {
          alert("회원가입 오류: " + error.message);
        });
    }

    // 6. 이메일 로그인
    function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          closeModal('login-modal');
        })
        .catch((error) => {
          alert("로그인 오류: " + error.message);
        });
    }

    // 7. 로그아웃
    function handleLogout() {
      auth.signOut();
    }

    // 8. 게시글 작성
    function handleCreatePost(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("로그인 후 게시글을 작성할 수 있습니다.");
        openModal('login-modal');
        return;
      }

      const titleInput = document.getElementById('post-title');
      const contentInput = document.getElementById('post-content');

      db.collection('posts').add({
        title: titleInput.value,
        content: contentInput.value,
        author: currentUser.displayName || currentUser.email.split('@')[0],
        uid: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        titleInput.value = '';
        contentInput.value = '';
      })
      .catch((error) => {
        alert("글 저장 실패: " + error.message);
      });
    }

    // 9. 실시간 게시글 목록 불러오기 (Firestore)
    db.collection('posts').orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        const container = document.getElementById('posts-container');
        if (snapshot.empty) {
          container.innerHTML = '<p class="text-gray-500 text-center py-8">아직 등록된 게시글이 없습니다. 첫 글을 작성해 보세요!</p>';
          return;
        }

        let html = '';
        snapshot.forEach((doc) => {
          const post = doc.data();
          const time = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';
          
          html += `
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-sm">
              <div class="flex justify-between items-start mb-2">
                <h3 class="text-lg font-bold text-white">${escapeHtml(post.title)}</h3>
                <span class="text-xs text-gray-500">${time}</span>
              </div>
              <p class="text-gray-300 text-sm whitespace-pre-wrap mb-3">${escapeHtml(post.content)}</p>
              <div class="text-xs text-blue-400 font-medium">
                ✍️ 작성자: ${escapeHtml(post.author)}
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      }, (error) => {
        console.error("데이터 읽기 실패:", error);
      });

    // XSS 방지 함수
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 모달 제어 함수
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>
